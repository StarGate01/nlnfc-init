########################### NXP NPC300 (NXP1001) ##############################
##
## Proprietary NCI initialization for the NXP NPC300/NXP1001, as found in
## some Lenovo laptops. Without this the chip detects tags but longer data
## exchanges drop out. See https://github.com/jurajsarinay/ifdnlnfc/issues/2 .
##
## Steps are applied in the order they appear below -- do not reorder.
## Frame format: {header-byte(MT|GID), OID, length, ...payload}, exactly as
## found in linux_libnfc-nci conf files and nixpkgs'
## nixos/modules/hardware/nfc-nci.nix (NXP_* keys there are copy-paste
## compatible with this file).
#################################################################################

# Unlock the proprietary CORE_SET_CONFIG parameters used below.
NXP_ACT_PROP_EXTN = {2F, 02, 00}

# Configure power supply of chip, use Lenovo driver configuration, which
# deviates a bit from the spec:
# 0xA0 0x0E: PMU_CFG = [ 0x16, 0x09, 0x00 ] (VBAT1 connected to 5V, TVDD
# monitoring: 3.6V, TxLDO Voltage in reader and card mode: 3.3V)
NXP_EXT_TVDD_CFG_1 = {20, 02, 07, 01,
    A0, 0E, 03, 16, 09, 00
}

# Configure the proprietary NXP extension to the NCI standard in EEPROM:
# 0xA0 0x5E: JEWEL_RID_CFG = 0x01 (Enable sending RID to T1T on RF)
# 0xA0 0x40: TAG_DETECTOR_CFG = 0x00 (Tag detector: Disable both AGC based
#            detection and trace mode)
# 0xA0 0x43: TAG_DETECTOR_FALLBACK_CNT_CFG = 0x00 (Tag detector: Disable
#            hybrid mode, only use LPCD to initiate polling)
# 0xA0 0x0F: DH_EEPROM_AREA_1 = [ 32 bytes of opaque Lenovo data ] (Custom
#            configuration for the Lenovo customized chip firmware)
# See also https://github.com/nfc-tools/libnfc/issues/455#issuecomment-2221979571
NXP_CORE_CONF_EXTN = {20, 02, 30, 04,
    A0, 5E, 01, 01,
    A0, 40, 01, 00,
    A0, 43, 01, 00,
    A0, 0F, 20,
    00, 03, 1D, 01, 03, 00, 02, 00,
    01, 00, 01, 00, 00, 00, 00, 00,
    00, 00, 00, 00, 00, 00, 00, 00,
    00, 00, 00, 00, 00, 00, 00, 00
}

# Enable chip standby mode, ready for discovery to start.
NXP_CORE_STANDBY = {2F, 00, 01, 01}
