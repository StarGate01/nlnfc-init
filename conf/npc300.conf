########################### NXP NPC300 (NXP1001) ##############################
##
## Proprietary NCI initialization for the NXP NPC300/NXP1001, as found in
## some Lenovo laptops. Without this the chip detects tags but longer data
## exchanges drop out. See https://github.com/jurajsarinay/ifdnlnfc/issues/2 .
##
## Values here are taken from nixpkgs'
## nixos/modules/hardware/nfc-nci.nix, the authoritative source for what
## actually gets deployed on this system (it generates the real
## /etc/libnfc-nxp-*.conf files) -- NXP_* keys there are copy-paste
## compatible with this file.
##
## Steps are applied in the order they appear below -- do not reorder
## without re-checking phNxpNciHal_core_initialized() in
## linux_libnfc-nci's src/halimpl/pn54x/hal/phNxpNciHal.c: that
## function's code path, not any conf file's key ordering (conf files are
## unordered key=value sets there), is what actually fixes the wire order
## on real hardware. As of that driver: ACT_PROP_EXTN, NFC_PROFILE_EXTN,
## EXT_TVDD_CFG_1, CORE_CONF_EXTN, CORE_STANDBY, CORE_CONF -- in that
## order, CORE_CONF last. This carries every NCI-frame entry nfc-nci.nix
## always applies for this chip; everything else in it (log levels, clock
## source, tech masks, ...) configures the full userspace HAL stack, not
## something this tool forwards over the wire.
#################################################################################

# Unlock the proprietary CORE_SET_CONFIG parameters used below.
NXP_ACT_PROP_EXTN = {2F, 02, 00}

# NFC Forum profile: 0xA0 0x44 POLL_PROFILE_SEL_CFG = 0x00 (use NFC Forum
# default configuration values, not EMVCo).
NXP_NFC_PROFILE_EXTN = {20, 02, 05, 01,
    A0, 44, 01, 00
}

# Configure power supply of chip, use Lenovo driver configuration, which
# deviates a bit from the spec:
# 0xA0 0x0E: PMU_CFG = [ 0x16, 0x09, 0x00 ] (VBAT1 connected to 5V, TVDD
# monitoring: 3.6V, TxLDO Voltage in reader and card mode: 3.3V)
# nfc-nci.nix selects this via NXP_EXT_TVDD_CFG=0x01 -- kept the upstream
# _1 suffix in the name even though this tool always sends exactly one
# fixed TVDD frame rather than switching between multiple defines.
NXP_EXT_TVDD_CFG_1 = {20, 02, 07, 01,
    A0, 0E, 03, 16, 09, 00
}

# Configure the proprietary NXP extension to the NCI standard in EEPROM:
# 0xA0 0x5E: JEWEL_RID_CFG = 0x01 (Enable sending RID to T1T on RF)
# 0xA0 0x40: TAG_DETECTOR_CFG = 0x00 (Tag detector: Disable both AGC based
#            detection and trace mode)
# 0xA0 0x43: TAG_DETECTOR_FALLBACK_CNT_CFG = 0x00 (Tag detector: Disable
#            hybrid mode, only use LPCD to initiate polling)
# 0xA0 0x0F: DH_EEPROM_AREA_1 = [ 32 bytes of opaque Lenovo data ] (Custom
#            configuration for the Lenovo customized chip firmware)
# See also https://github.com/nfc-tools/libnfc/issues/455#issuecomment-2221979571
NXP_CORE_CONF_EXTN = {20, 02, 30, 04,
    A0, 5E, 01, 01,
    A0, 40, 01, 00,
    A0, 43, 01, 00,
    A0, 0F, 20,
    00, 03, 1D, 01, 03, 00, 02, 00,
    01, 00, 01, 00, 00, 00, 00, 00,
    00, 00, 00, 00, 00, 00, 00, 00,
    00, 00, 00, 00, 00, 00, 00, 00
}

# Enable chip standby mode.
NXP_CORE_STANDBY = {2F, 00, 01, 01}

# Standard (non-proprietary) NCI EEPROM settings, applied last so they take
# effect once standby mode is already active:
# 0x28 PN_NFC_DEP_SPEED = 0x00 (data exchange: highest available bit rate)
# 0x21 PI_BIT_RATE = 0x00 (maximum allowed poll bit rate: 106 Kbit/s)
# 0x30 LA_BIT_FRAME_SDD = 0x08 (bit frame SDD value sent in byte 1 of SENS_RES)
# 0x31 LA_PLATFORM_CONFIG = 0x03 (platform configuration sent in byte 2 of SENS_RES)
# 0x33 LA_NFCID1 = 04 03 02 01 ("unique" NFCID1 sent in SENS_RES)
# 0x54 LF_CON_BITR_F = 0x06 (listen bit rates: both)
# 0x50 LF_PROTOCOL_TYPE = 0x02 (NFC-F listen protocols supported: NFC-DEP)
# 0x5B LI_BIT_RATE = 0x00 (maximum supported listen bit rate: 106 Kbit/s)
# 0x60 LN_WT = 0x0E (NFC-DEP WT_MAX default for initiator)
# 0x80 RF_FIELD_INFO = 0x01 (allow RF field information notifications)
# 0x81 RF_NFCEE_ACTION = 0x01 (send trigger notification for default NFCEE actions)
# 0x82 NFCDEP_OP = 0x0E (default flags, also enable RTOX requests)
# 0x18 PF_BIT_RATE = 0x01 (NFC-F discovery polling initial bit rate: 106 Kbit/s)
NXP_CORE_CONF = {20, 02, 2B, 0D,
    28, 01, 00,
    21, 01, 00,
    30, 01, 08,
    31, 01, 03,
    33, 04, 04, 03, 02, 01,
    54, 01, 06,
    50, 01, 02,
    5B, 01, 00,
    60, 01, 0E,
    80, 01, 01,
    81, 01, 01,
    82, 01, 0E,
    18, 01, 01
}
